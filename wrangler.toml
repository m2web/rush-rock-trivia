# Cloudflare Pages configuration
name = "rush-rock-trivia"
compatibility_date = "2024-10-29"
pages_build_output_dir = "dist"

# Standard Environment Variables (non-sensitive)
[vars]
USE_OPENAI = "true"

# Pages Functions are automatically detected in the /functions directory
# API Keys (GEMINI_API_KEY, OPENAI_API_KEY) are managed via Cloudflare Dashboard Secrets

# Cloudflare D1 Database Binding for Fan Meetups & Parties
[[d1_databases]]
binding = "DB"
database_name = "rush_fan_parties"
database_id = "bb8df262-f34d-4920-989d-2da28d3bd769"