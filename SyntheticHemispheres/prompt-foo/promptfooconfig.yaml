description: "Rush Trivia Evaluation: GPT-4.1 Mini vs GPT-5 Mini"

outputPath: gpt-4.1-mini_gpt-5-mini.json

prompts:
  - |
    You are an expert on the rock band Rush. Answer the following trivia question using ONLY the provided context. If the context does not contain the answer, say "I don't know based on the context."

    Context:
    {{context}}

    Question:
    {{question}}

providers:
  - id: openai:gpt-4.1-mini
  - id: openai:gpt-5-mini

defaultTest:
  options:
    provider: openai:gpt-4o-mini  # Use a high-quality judge
  assert:
    - type: factuality
      value: "{{ground_truth}}"

tests:
  - rush_full_eval.jsonl
